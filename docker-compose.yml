x-studio-environment:
  &studio-environment
    MPLBACKEND: ps
    SHELL: /bin/bash
    STORAGE_EMULATOR_HOST: http://gcs:4443
    GOOGLE_CLOUD_PROJECT: studio-emulator
    AWS_BUCKET_NAME: content
    DATA_DB_HOST: postgres
    DJANGO_SETTINGS_MODULE: contentcuration.dev_settings
    CELERY_TIMEZONE: America/Los_Angeles
    CELERY_REDIS_DB: 0
    CELERY_BROKER_ENDPOINT: redis
    CELERY_RESULT_BACKEND_ENDPOINT: redis
    CELERY_REDIS_PASSWORD: ""
    REMAP_SIGTERM: "SIGQUIT"
    WEBPACK_DEV_HOST: 0.0.0.0

x-studio-worker:
  &studio-worker
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: learningequality/studio-app-dev
    depends_on:
      - gcs
      - postgres
      - redis
    volumes:
      - .:/src
    environment: *studio-environment

services:
  studio-nginx:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx.prod
    ports:
      - "8081:8080"
    depends_on:
      - studio-app
    environment: *studio-environment

  studio-app:
    <<: *studio-worker
    entrypoint: python docker/studio-dev/entrypoint.py
    command: pnpm run devserver
    ports:
      - "8080:8080"
      - "4000:4000"

  celery-worker:
    <<: *studio-worker
    command: make prodceleryworkers

  gcs:
    image: fsouza/fake-gcs-server:1.55.1
    entrypoint: ["sh", "-c", "mkdir -p /storage/content && exec /bin/fake-gcs-server \"$$@\"", "--"]
    command: -scheme http -public-host ${GCS_PUBLIC_HOST:-gcs:4443} -backend filesystem -filesystem-root /storage -cors-headers Content-MD5
    ports:
      - "4443:4443"
    volumes:
      - gcs:/storage

  postgres:
    image: ghcr.io/learningequality/postgres
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres.dev
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: learningequality
      POSTGRES_PASSWORD: kolibri
      POSTGRES_DB: kolibri-studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
      - .docker/postgres:/docker-entrypoint-initdb.d

  redis:
    image: redis:6.0.9
    ports:
      - "6379:6379"


volumes:
  gcs:
  pgdata:
